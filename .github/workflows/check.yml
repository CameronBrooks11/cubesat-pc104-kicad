name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kicad:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6
      options: --user root
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install just
        run: apt-get update && apt-get install -y --no-install-recommends just

      - name: KiCad version
        run: kicad-cli version

      - name: just check
        run: just check
