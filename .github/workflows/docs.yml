name: Docs site

# Renders the library and boards with kicad-cli, builds the MkDocs site from
# docs/, and publishes it to GitHub Pages from main. A pull request builds it
# only, so a broken page or a missing picture fails before it can deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6
      options: --user root
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install just
        run: apt-get update && apt-get install -y --no-install-recommends just

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: just renders
        run: just renders

      - name: just docs
        run: just docs

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
